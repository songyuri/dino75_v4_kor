
name: Dino75 V4 Korean Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install requests playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Build Korean website
        working-directory: dino75v4_github_pages_ready
        run: python scripts/build.py --repository "$GITHUB_REPOSITORY" --output site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dino75v4_github_pages_ready/site
      - id: deployment
        uses: actions/deploy-pages@v4
